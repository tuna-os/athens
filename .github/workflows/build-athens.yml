name: Build and boot Athens candidate

on:
  workflow_dispatch:
    inputs:
      tromso_controls_ref:
        description: Tromso committed artwork ref for wrong-city controls
        type: string
        default: fix/tromso-health
      brussels_controls_ref:
        description: Brussels committed artwork ref for wrong-city controls
        type: string
        default: codename/brussels
  workflow_call:
    inputs:
      tromso_controls_ref:
        type: string
        default: fix/tromso-health
      brussels_controls_ref:
        type: string
        default: codename/brussels

permissions:
  contents: read

concurrency:
  # Branch candidates share rolling GHCR caches; serialize all cache writers.
  group: athens-candidate
  cancel-in-progress: false

jobs:
  dependencies:
    uses: tuna-os/bst-ci/.github/workflows/multirunner-build.yml@89c7d20d6e113533278158d7e5df64f663770e49
    permissions:
      contents: read
      packages: write
    with:
      image_name: athens
      bst_target: oci/athens.bst
      num_chunks: '4'
      core_split: '200'
      core_budget_minutes: '200'
      chunk_budget_minutes: '200'
      # These jobs only warm caches. Final assembly must really finish below.
      soft_core_budget: true
      soft_chunk_budget: true

  candidate:
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
      MATRIX_KEYS: ${{ needs.dependencies.outputs.matrix_keys }}
      CACHE_KEYS: ${{ needs.dependencies.outputs.cache_keys }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@3f13feab2962a87273d379ebc36ea159527e6cc9
        with:
          tool-cache: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2

      - name: Install boot qualification tools
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf zstd
          squashfs-tools dosfstools mtools xorriso skopeo openssh-client sshpass
          tesseract-ocr imagemagick librsvg2-bin python3-yaml python3-pil python3-opencv

      - name: Restore BuildStream sources
        id: sources
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/buildstream/sources
          key: bst-sources-athens-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('elements/**/*.bst', 'project.conf', 'include/**', 'patches/**') }}-final-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bst-sources-athens-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('elements/**/*.bst', 'project.conf', 'include/**', 'patches/**') }}-
            bst-sources-athens-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore dependency artifacts without staging compressed copies
        shell: bash
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p "$HOME/.cache/buildstream"
          base="ghcr.io/${GITHUB_REPOSITORY,,}/cache-athens"
          restore() {
            local ref="$1" digest
            digest=$(oras manifest fetch "$ref" | jq -er '.layers[] | select(.mediaType == "application/vnd.buildstream.cas.tar.zst") | .digest') || return 1
            test -n "$digest" || return 1
            oras blob fetch --output - "${ref%:*}@${digest}" | zstd -d -c | tar -xf - -C "$HOME/.cache/buildstream"
          }
          restore "${base}-core:latest" || echo '::warning::Core cache unavailable; BuildStream will rebuild missing artifacts'
          while IFS= read -r chunk; do
            key=$(jq -r --arg chunk "$chunk" '.[$chunk] // empty' <<< "$CACHE_KEYS")
            if [[ -n "$key" ]] && restore "${base}-${chunk}:${key}"; then
              continue
            fi
            restore "${base}-${chunk}:latest" || echo "::warning::${chunk} cache unavailable; BuildStream will rebuild missing artifacts"
          done < <(jq -r '.[]' <<< "$MATRIX_KEYS")

      - name: Build actual Athens OCI output
        run: |
          mkdir -p logs
          just bst --log-file /src/logs/athens-build.log build oci/athens.bst
          just export-oci
      - name: Save fetched sources even after a failed build
        if: always() && steps.sources.outputs.cache-primary-key != '' && steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/buildstream/sources
          key: ${{ steps.sources.outputs.cache-primary-key }}


      - name: Load and lint the local candidate
        run: |
          just load-oci
          just lint-oci

      - name: Check plain backend liveness (not GUI or branding qualification)
        run: just smoke-oci

      - name: Check out the exact shared visual engines
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tuna-os/tunaos
          ref: 0b577a9eb2d83b49eecbaf25d083f458e003e70b
          path: .visual-contract
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/install-checkpoints.py
            /scripts/installer-walkthrough.py

      - name: Check out genuine Tromso artwork controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tuna-os/tromso
          ref: ${{ inputs.tromso_controls_ref }}
          path: visual-controls/tromso
          sparse-checkout: branding
          persist-credentials: false

      - name: Check out genuine Brussels artwork controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tuna-os/xfce-linux
          ref: ${{ inputs.brussels_controls_ref }}
          path: visual-controls/xfce-linux
          sparse-checkout: branding
          persist-credentials: false

      - name: Produce exact-source Athens GUI qualification ISO
        run: |
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/athens-qualification"
          sudo python3 scripts/build-live-iso.py ghcr.io/tuna-os/athens:latest \
            --output athens-live-qualification --source-commit "$GITHUB_SHA" \
            --automation-public-key "$RUNNER_TEMP/athens-qualification.pub"
          sudo podman image prune -f

      - name: Qualify real GTK encrypted install and current branding
        run: |
          sudo python3 scripts/qualify-iso.py athens-live-qualification \
            --contract "$GITHUB_WORKSPACE/.visual-contract" \
            --control-root "$GITHUB_WORKSPACE/visual-controls" \
            --automation-key "$RUNNER_TEMP/athens-qualification"

      - name: Destroy disposable qualification key
        if: always()
        run: rm -f "$RUNNER_TEMP/athens-qualification" "$RUNNER_TEMP/athens-qualification.pub"

      - uses: actions/upload-artifact@v7
        with:
          name: athens-live-qualification-${{ github.sha }}
          path: |
            athens-live-qualification/source.json
          retention-days: 3
          if-no-files-found: error

      - name: Archive source OCI after observer-assisted GUI qualification
        run: tar -C buildstream-oci -cf - . | zstd -T0 -o athens-oci.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: athens-oci-${{ github.sha }}
          path: athens-oci.tar.zst
          retention-days: 3
          if-no-files-found: error

      - name: Upload build and boot evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: athens-evidence-${{ github.run_id }}
          path: |
            logs/
            bootc-smoke/install.log
            bootc-smoke/serial.log
            athens-live-qualification/build.log
            athens-live-qualification/source.json
            athens-live-qualification/installer-info.txt
            athens-live-qualification/installer-flatpaks.tsv
            athens-luks-qualification/*.json
            athens-luks-qualification/*.yaml
            athens-luks-qualification/*.log
            athens-luks-qualification/*.tap
            athens-luks-qualification/*.png
          retention-days: 14
          if-no-files-found: warn
