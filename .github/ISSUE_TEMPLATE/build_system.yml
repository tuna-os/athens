name: Build System
description: Report an issue with the OS build system, NOT with the OS itself

body:
  - type: markdown
    attributes:
      value: |
        This repository is for the Athens OS BuildStream recipe and image build system. File issues here for Athens build, recipe, or image problems.

        Athens is based on JumpyVi's [`elementary-build-meta`](https://github.com/jumpyvi/elementary-build-meta) and uses upstream Elementary/Pantheon components. For upstream component issues, report them to the relevant upstream project.

        Include the failing element or image target, architecture, and relevant build log when possible.

  - type: textarea
    attributes:
      label: What Happened?
      description: A detailed description of unexpected behavior will help us address your issue more quickly. Do your best!
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Explain the exact steps one would take to experience the issue. If applicable, add screenshots or screen recordings.
      placeholder: |
          1. Went here
          2. Did this
          3. Clicked that
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior
      description: Explain how what happened is different from what you wanted to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Image Version
      description: Athens image version you are attempting to build or run
      placeholder: Athens version, branch, or commit
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Build Type
      description: The part of Athens you are building
      options:
        - BuildStream element
        - Mkosi OS image
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Hardware Platform
      description: Athens image architecture you are building or testing
      options:
        - x86_64 (AMD64)
        - aarch64 (ARM64)
    validations:
      required: true

  - type: textarea
    attributes:
      label: Log Output
      render: shell

  - type: textarea
    attributes:
      label: Hardware Info
      description: Relevant hardware information such as graphics drivers, unconventional setups, etc.
