[Match]
Distribution=buildstream

[Content]
RemoveFiles=
    /usr/bin/chsh
    /usr/bin/lchsh

[Output]
Format=disk
SplitArtifacts=partitions,uki
CompressOutput=false
Output=athens_%v

[Content]
Bootable=yes
Packages=stacks/athens.bst
KernelInitrdModules=
    default
    /drivers/hid/
    /drivers/usb/
    /drivers/input/
    /drivers/i2c/
    /drivers/spi/
    /drivers/pinctrl/
    /drivers/mfd/intel-lpss*         # I2C/SPI controllers for laptop keyboards
    /drivers/platform/surface/
    /drivers/platform/chrome/
    /drivers/tty/serial/8250/8250_dw # Surface keyboards via SAM
    /drivers/ata/
    /drivers/nvme/
    /drivers/scsi/
    /drivers/message/fusion/
    /drivers/block/
    /drivers/mmc/
    /drivers/ufs/
    /drivers/firewire/
KernelCommandLine=
    splash
    quiet
    root=dissect
    mount.usr=dissect
    rw
    audit=0
    systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=unprotected+encrypted+absent:home=unprotected+absent:=ignore
    systemd.image_filter=usr=athens_*:usr-verity=athens_*:usr-verity-sig=athens_*:root=athens-*:home=athens-*
    ipe.enforce=0


[Validation]
SecureBoot=no
SignExpectedPcr=no
