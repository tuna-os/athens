# BuildStream config used by the pinned bst2 container in CI and local builds.
scheduler:
  on-error: quit
  fetchers: 12
  builders: 1
  network-retries: 3
logging:
  message-format: '[%{wallclock}][%{elapsed}][%{key}][%{element}] %{action} %{message}'
  error-lines: 80
build:
  max-jobs: 0
  retry-failed: True
cache:
  cache-buildtrees: never
  # Bound stale artifact history, leaving room for sources and CAS archives.
  # Required artifacts/build sandboxes can still exceed this quota.
  quota: 60G
